name: udlaia-stats-services
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: udla_postgres
    container_name: udla_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_usuarios.sql:/docker-entrypoint-initdb.d/01_init_usuarios.sql
      - ./init_jugadores.sql:/docker-entrypoint-initdb.d/02_init_jugadores.sql
      - ./init_torneos.sql:/docker-entrypoint-initdb.d/03_init_torneos.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  authservice:
    image: dase123/udlaia-stats:authservice
    container_name: authservice
    restart: always
    env_file: .env
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      FRONTEND_URL: ${FRONTEND_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${AUTH_SECRET_KEY}
      LAUNCHDARKLY_SDK_KEY: ${LAUNCHDARKLY_SDK_KEY}
      DEV_KEY: ${DEV_KEY}
      LDCLIENT_ID: ${LDCLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:8010"
    networks:
      - app-net

  teamservice:
    image: dase123/udlaia-stats:teamservice
    container_name: teamservice
    restart: always
    env_file: .env
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${TEAM_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${TEAM_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      LAUNCHDARKLY_SDK_KEY: ${LAUNCHDARKLY_SDK_KEY}
      DEV_KEY: ${DEV_KEY}
      LDCLIENT_ID: ${LDCLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8020:8020"
    networks:
      - app-net

  studentservice:
    image: dase123/udlaia-stats:studentservice
    container_name: studentservice
    restart: always
    env_file: .env
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${STUDENT_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${STUDENT_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      LAUNCHDARKLY_SDK_KEY: ${LAUNCHDARKLY_SDK_KEY}
      DEV_KEY: ${DEV_KEY}
      LDCLIENT_ID: ${LDCLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8030:8030"
    networks:
      - app-net

  upload_service:
      image: dase123/udlaia-stats:upload_service
      container_name: upload_service
      restart: always
      env_file: .env
      environment:
        DEBUG: "true"
        WORKER_URL: ${WORKER_URL}
        VIDEO_UPLOAD_NOTIFY_URL: ${VIDEO_UPLOAD_NOTIFY_URL}
        ANALYSIS_SERVICE_URL: ${ANALYSIS_SERVICE_URL}
        SECRET_KEY: ${UPLOAD_SECRET_KEY}
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - "8050:8050"
      networks:
        - app-net

  trigger-service:
    build:
      context: .
      dockerfile: Dockerfile.triggers
    container_name: trigger-service
    restart: no
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      studentservice:
        condition: service_started
      teamservice:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - app-net


volumes:
  postgres_data:
    driver: local

networks:
  app-net:
    external: true
    driver: bridge
    name: shared-net