name: udlaia-stats-services
services:
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-net

  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SESSION_TIMEOUT_MS: 30000
      KAFKA_HEARTBEAT_INTERVAL_MS: 10000
      KAFKA_MAX_POLL_INTERVAL_MS: 300000
      KAFKA_MAX_POLL_RECORDS: 50

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - broker_data:/var/lib/kafka/data
    networks:
      - app-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - app-net
    restart: on-failure

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: udla_postgres
    container_name: udla_postgres
    restart: always
    env_file: envs/common.env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5440:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_usuarios.sql:/docker-entrypoint-initdb.d/01_init_usuarios.sql
      - ./init_jugadores.sql:/docker-entrypoint-initdb.d/02_init_jugadores.sql
      - ./init_torneos.sql:/docker-entrypoint-initdb.d/03_init_torneos.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  authservice:
    image: dase123/udlaia-stats:authservice
    container_name: authservice
    restart: always
    env_file:
      - envs/common.env
      - envs/auth.env
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8010"
    networks:
      - app-net

  teamservice:
    image: dase123/udlaia-stats:teamservice
    container_name: teamservice
    restart: always
    env_file:
      - envs/common.env
      - envs/team.env
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8020:8020"
    networks:
      - app-net

  studentservice:
    image: dase123/udlaia-stats:studentservice
    container_name: studentservice
    restart: always
    env_file:
      - envs/common.env
      - envs/student.env
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8030:8030"
    networks:
      - app-net

  upload_service:
    image: dase123/udlaia-stats:upload_service
    container_name: upload_service
    restart: always
    env_file:
      - envs/common.env
      - envs/upload.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8050:8050"
    networks:
      - app-net

  events_service:
    image: dase123/udlaia-stats:events_service
    container_name: events_service
    restart: always
    ports:
      - "8060:8060"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
      - redis
    networks:
      - app-net
    env_file:
      - envs/common.env
      - envs/events.env

  trigger-service:
    build:
      context: .
      dockerfile: Dockerfile.triggers
    container_name: trigger-service
    restart: no
    env_file: envs/common.env
    depends_on:
      studentservice:
        condition: service_started
      teamservice:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - app-net

volumes:
  postgres_data:
    driver: local
  broker_data:
    driver: local

networks:
  app-net:
    external: true
    driver: bridge
    name: shared-net
